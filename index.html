<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Repos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    color: #00ff41;
    padding: 0;
  }

  #root {
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    margin: 12px;
  }

  .title-bar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .title-left {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #e6edf3;
    font-weight: 600;
    font-size: 13px;
  }

  .prompt { color: #00ff41; }
  .timestamp { color: #8b949e; font-size: 11px; }

  .sort-row { display: flex; gap: 6px; align-items: center; }
  .sort-label { color: #8b949e; font-size: 11px; }

  .sort-btn {
    background: transparent;
    border: 1px solid #30363d;
    color: #8b949e;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: monospace;
  }
  .sort-btn.active {
    background: rgba(0,255,65,0.1);
    border-color: #00ff41;
    color: #00ff41;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1px;
    background: #21262d;
  }

  .card {
    background: #0d1117;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
  }

  .repo-name {
    color: #58a6ff;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .repo-name:hover { text-decoration: underline; }

  .repo-desc {
    color: #8b949e;
    font-size: 12px;
    line-height: 1.5;
    flex: 1;
    font-family: system-ui, sans-serif;
  }

  .meta {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-top: auto;
    font-size: 11px;
    color: #8b949e;
  }

  .lang-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
  }

  .meta-right { margin-left: auto; }

  .footer {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #8b949e;
    font-size: 11px;
  }

  .footer a { color: #58a6ff; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  .state-box {
    padding: 40px 16px;
    text-align: center;
    color: #8b949e;
    font-size: 12px;
  }

  .error { color: #f85149; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const USERNAME = 'liamromanis101';

const LANG_COLORS = {
  Python: '#3572A5', JavaScript: '#f1e05a', TypeScript: '#2b7489',
  PHP: '#4F5D95', Shell: '#89e051', 'C#': '#178600',
  C: '#555555', 'C++': '#f34b7d', Perl: '#0298c3', Ruby: '#701516'
};

const FILE_ICON = `<svg width="14" height="14" viewBox="0 0 16 16" fill="#58a6ff" style="flex-shrink:0;vertical-align:-2px"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/></svg>`;
const STAR_ICON = `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:-2px"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>`;
const FORK_ICON = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:-1px"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>`;

let allRepos = [];
let sortBy = 'stars';

function relativeTime(dateStr) {
  const diff = Date.now() - new Date(dateStr);
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return '1d ago';
  if (days < 30) return days + 'd ago';
  const months = Math.floor(days / 30);
  if (months < 12) return months + 'mo ago';
  return Math.floor(months / 12) + 'y ago';
}

function getSorted() {
  return [...allRepos].sort((a, b) => {
    if (sortBy === 'stars') return b.stargazers_count - a.stargazers_count;
    if (sortBy === 'updated') return new Date(b.updated_at) - new Date(a.updated_at);
    if (sortBy === 'forks') return b.forks_count - a.forks_count;
    return 0;
  }).slice(0, 6);
}

function renderCard(repo) {
  const langDot = repo.language
    ? `<span><span class="lang-dot" style="background:${LANG_COLORS[repo.language] || '#8b949e'}"></span><span>${repo.language}</span></span>`
    : '';
  const stars = repo.stargazers_count > 0
    ? `<span>${STAR_ICON} ${repo.stargazers_count}</span>` : '';
  const forks = repo.forks_count > 0
    ? `<span>${FORK_ICON} ${repo.forks_count}</span>` : '';
  const desc = repo.description
    ? `<p class="repo-desc">${repo.description}</p>`
    : `<p class="repo-desc" style="color:#484f58;font-style:italic">no description</p>`;

  return `<div class="card">
    <a class="repo-name" href="${repo.html_url}" target="_blank" rel="noreferrer">
      ${FILE_ICON}${repo.name}
    </a>
    ${desc}
    <div class="meta">
      ${langDot}${stars}${forks}
      <span class="meta-right">${relativeTime(repo.updated_at)}</span>
    </div>
  </div>`;
}

function renderGrid() {
  const sorted = getSorted();
  document.getElementById('grid').innerHTML = sorted.map(renderCard).join('');
  document.getElementById('footer-count').textContent =
    `showing ${sorted.length} of ${allRepos.length} repos`;
}

function setSort(val) {
  sortBy = val;
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.sort === val);
  });
  renderGrid();
}

function render(state, data) {
  const root = document.getElementById('root');

  if (state === 'loading') {
    root.innerHTML = `
      <div class="title-bar">
        <div class="title-left">
          <span class="prompt">$</span>
          <span style="color:#c9d1d9">ls -la /repos/</span>
        </div>
      </div>
      <div class="state-box">fetching repos from github api…</div>`;
    return;
  }

  if (state === 'error') {
    root.innerHTML = `
      <div class="title-bar">
        <div class="title-left">
          <span class="prompt">$</span>
          <span style="color:#c9d1d9">ls -la /repos/</span>
        </div>
      </div>
      <div class="state-box error">✗ ${data}<br><span style="color:#8b949e">check network or GitHub API rate limit</span></div>`;
    return;
  }

  const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  root.innerHTML = `
    <div class="title-bar">
      <div class="title-left">
        <span class="prompt">$</span>
        <span style="color:#c9d1d9">ls -la /repos/</span>
        <span class="timestamp">fetched ${now}</span>
      </div>
      <div class="sort-row">
        <span class="sort-label">sort:</span>
        <button class="sort-btn active" data-sort="stars">stars</button>
        <button class="sort-btn" data-sort="updated">updated</button>
        <button class="sort-btn" data-sort="forks">forks</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer">
      <span id="footer-count"></span>
      <a href="https://github.com/${USERNAME}?tab=repositories" target="_blank" rel="noreferrer">view all on github →</a>
    </div>`;

  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => setSort(btn.dataset.sort));
  });

  renderGrid();
}

async function init() {
  render('loading');
  try {
    const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&type=owner`);
    if (!res.ok) throw new Error('GitHub API error: ' + res.status);
    const data = await res.json();
    allRepos = data.filter(r => !r.fork);
    render('ready');
  } catch (e) {
    render('error', e.message);
  }
}

init();
</script>
</body>
</html>
